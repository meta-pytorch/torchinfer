[[linter]]
code = 'UFMT'
include_patterns = [
    '**/*.py',
    '**/*.pyi',
]
exclude_patterns = [
    '.venv/**',
    'fb/**',
]
command = [
    'python',
    '-m',
    'lintrunner_adapters',
    'run',
    'ufmt_linter',
    '--',
    '@{{PATHSFILE}}',
]
init_command = [
    'python',
    '-m',
    'lintrunner_adapters',
    'run',
    'pip_init',
    '--dry-run={{DRYRUN}}',
    'black==25.11.0',
    'ruff-api==0.2.1',
    'stdlibs==2025.10.28',
    'ufmt==2.9.1',
    'usort==1.1.0',
]
is_formatter = true

[[linter]]
code = 'HIPTEMPLATES'
include_patterns = [
    'aot_tensor/compile/triton/gen_hip_templates.py',
    'aot_tensor/compile/triton/templates/kernel.h',
    'aot_tensor/compile/triton/templates/kernel.cpp',
    'aot_tensor/compile/triton/templates/hip/kernel.h',
    'aot_tensor/compile/triton/templates/hip/kernel.cpp',
]
command = [
    'python',
    '-m',
    'aot_tensor.compile.triton.hip_template_linter',
    '--templates-dir=aot_tensor/compile/triton/templates',
    '@{{PATHSFILE}}',
]
is_formatter = true
